<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mirkwood LCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet game table at night, the cards do the talking
   IDEA: the felt playmat of an LCG, zones ruled in bronze like the user's own board
   PICTURE: the board itself, with official card art when the image host is reachable, printed card faces otherwise
   COLOUR and TYPE: near-black table, warm brown panels, one gold accent; sphere colours only on cards; Cinzel for card names, Figtree for UI
   LAYOUT: menu pages as a single column of accordions; the board as three ruled rows filling a landscape screen */
:root{color-scheme:dark;--bg:#0b0a09;--pan:#1d1915;--pan2:#26211b;--line:#3b332a;--ink:#efe8dc;--mut:#a59a8a;--gold:#d9b65f;--red:#b8392f;--grn:#3f9450;--blu:#3a90cc;
  --ch:clamp(70px,calc((100dvh - 64px - env(safe-area-inset-bottom))/3 - 34px),190px);--cw:calc(var(--ch)*.716)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:14px max(5vw,16px) 0;padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.brand{font:700 20px Cinzel,serif;letter-spacing:.02em}.brand span{color:var(--gold);margin-left:6px;font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{color:var(--mut);text-decoration:none;padding:10px 12px 12px;border-bottom:2px solid transparent;font-weight:500}
nav a.on{color:var(--ink);border-color:var(--ink)}nav a.live{color:var(--gold)}
.page{max-width:1000px;margin:0 auto;padding:28px max(5vw,16px) 60px;padding-bottom:max(60px,env(safe-area-inset-bottom))}
h1{font:700 clamp(30px,5vw,44px)/1.05 Cinzel,serif;margin:0 0 10px}
h2{font:600 20px/1.2 Figtree,sans-serif;margin:30px 0 12px}h2 small{color:var(--mut);font-weight:500}
.lede{color:var(--mut);max-width:68ch;margin:0 0 24px}.muted{color:var(--mut)}
.search,.bbar input{width:100%;max-width:520px;font-size:16px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:#0f0d0b;color:var(--ink);margin-bottom:18px}
.ed{border:1px solid color-mix(in srgb,var(--ec) 70%,#555);background:linear-gradient(180deg,color-mix(in srgb,var(--ec) 45%,#1b1814),#151210);border-radius:18px;margin-bottom:12px;overflow:hidden}
.edh{display:flex;align-items:center;gap:12px;width:100%;padding:18px 20px;background:none;border:0;font-weight:700;font-size:clamp(17px,2.4vw,22px);text-align:left;min-height:56px}
.dot{width:14px;height:14px;border-radius:50%;background:color-mix(in srgb,var(--ec) 60%,#777);flex:none}.dot.on{background:var(--gold);box-shadow:0 0 0 4px #d9b65f33}
.chev{margin-left:auto;font-size:13px;color:var(--mut)}
.scen{display:grid;gap:10px;padding:0 20px 20px}
.sc{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:#161310;font-size:17px;min-height:52px}
.sc small{font-size:13px;color:var(--gold);white-space:nowrap}
button.sc:hover{border-color:var(--gold)}
.sc.off{color:#6d665c;background:#13110f}.sc.off small{color:#5e574e}
.how{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;color:var(--mut)}.how summary{cursor:pointer;color:var(--ink);font-weight:600;min-height:44px;display:flex;align-items:center}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px}
.deck{border:1px solid var(--line);background:var(--pan);border-radius:14px;padding:12px;cursor:pointer;display:grid;gap:4px}
.deck:hover{border-color:var(--gold)}.deck.off{opacity:.45;filter:grayscale(1)}
.deck b{font-size:17px}.deck small{color:var(--mut)}
.hstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.hmini{position:relative;aspect-ratio:.72;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,var(--sc),#1a1714 75%);display:flex;align-items:flex-end;padding:6px}
.hmini b{font:600 11px/1.2 Cinzel,serif}.hmini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.tile{position:relative;cursor:pointer}.tile .card{width:100%;height:auto;aspect-ratio:.716}
.tile.locked{opacity:.4;filter:grayscale(1)}.tile.pick .card{outline:2px solid var(--gold)}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.qty button{width:44px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--pan2);font-size:18px}
.bbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.bbar input{margin:0;max-width:260px}.bbar span{color:var(--mut);flex:1 1 200px}
.gold,.ghost{border-radius:10px;padding:10px 18px;min-height:44px;font-weight:600;border:1px solid var(--line);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.gold{background:var(--gold);color:#1b1408;border-color:var(--gold)}.gold:disabled{opacity:.4;cursor:default}
.ghost{background:#14110e;color:var(--ink)}
.ib{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#14110e;font-size:16px}

/* cartas */
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:calc(var(--ch)*.05);overflow:hidden;background:#151210;border:1px solid #4a4034;flex:none;cursor:pointer;transition:transform .15s}
.card.wide{width:calc(var(--ch)*1.4)}
.card{container-type:size}
@container (max-height:130px){.face .tx,.face .tr{display:none}.face .ty{margin-bottom:2px}}
.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.face{position:absolute;inset:0;padding:6% 7%;display:flex;flex-direction:column;gap:2px;background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 55%,#1a1612) 0 22%,#ece2cf 22%);color:#20180f;font-size:clamp(7px,calc(var(--ch)*.052),12px);line-height:1.25}
.face .nm{font:700 1.25em/1.1 Cinzel,serif;color:#fff;text-shadow:0 1px 2px #000;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.face .ty{color:#f1e7d4;font-size:.85em;font-style:normal;opacity:.9;margin-bottom:6%}
.face .st{display:flex;flex-wrap:wrap;gap:3px}.face .st span{background:#2a2119;color:#f6eddc;border-radius:4px;padding:0 4px;font-weight:700}
.face .st small{font-size:.75em;opacity:.7;margin-right:2px;font-weight:500}
.face .tr{font-weight:600;font-style:italic}.face .tx{margin:0;overflow:hidden;flex:1}.face .sh{color:#6b2018;font-style:italic}
.card.hl{box-shadow:0 0 0 3px var(--gold),0 0 18px #d9b65f88}
.card.sel{box-shadow:0 0 0 4px var(--blu),0 0 18px #3a90cc99;transform:translateY(-4px)}
.slot{position:relative;flex:none;padding-top:calc(var(--n)*14px);display:flex;align-items:flex-end}
.slot.exh{width:var(--ch);justify-content:center}.slot.exh>.card{transform:rotate(90deg) scale(.86)}
.slot.exh.wide{width:calc(var(--ch)*1.4)}
.att{position:absolute;left:calc(var(--i)*8px);top:calc(var(--i)*14px);width:var(--cw);height:calc(var(--ch)*.5);border-radius:6px;overflow:hidden;background:#3a3227;border:1px solid #6b5c47;font-size:10px;padding:2px 5px;cursor:pointer}
.att b{position:relative;z-index:1;text-shadow:0 1px 2px #000}.att img{position:absolute;inset:0;width:100%;height:auto}
.att .ax{position:absolute;right:3px;top:2px;z-index:2;font-size:9px;color:var(--gold)}
.shd{width:calc(var(--cw)*.55);height:calc(var(--ch)*.55);border-radius:6px;overflow:hidden;margin-left:-10px;align-self:flex-start;position:relative;border:1px solid #6d2a22;background:#3a1714;font-size:9px;padding:3px;cursor:pointer}
.shd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.back{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#c9561f,#5a120c 70%);color:#fff0d0;font:700 12px Cinzel,serif}
.back.player{background:radial-gradient(circle,#c9a227,#3b2a0a 70%)}.back img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bd{position:absolute;z-index:3;font-style:normal;font-weight:700;font-size:clamp(10px,calc(var(--ch)*.085),15px);border-radius:999px;padding:1px 8px;line-height:1.5;box-shadow:0 1px 3px #000a}
.res{top:4px;right:4px;background:#2a2112;color:var(--gold);border:1px solid var(--gold)}
.dmg{bottom:4px;left:4px;background:var(--red);color:#fff}
.prg{bottom:4px;right:4px;background:var(--grn);color:#fff}
.com{top:4px;left:4px;background:var(--blu);color:#fff;font-size:10px}
.thr{top:4px;right:4px;background:#5a1c18;color:#ffd9d2;border:1px solid #b8392f}
.sts{bottom:4px;right:4px;background:#000c;color:#fff;font-size:10px}
.atk{bottom:4px;right:4px;background:#5a1c18;color:#fff;font-size:10px}
.note{top:4px;left:4px;background:var(--gold);color:#1b1408;font-size:10px}
.cnt{top:6px;right:6px;background:#000c;color:#fff}
.prgq{right:10px;bottom:10px;background:var(--grn);color:#fff}
.thrT{right:10px;top:10px;background:#5a1c18;color:#ffd9d2;border:1px solid var(--red);font-size:16px}

/* mesa */
#app.is-board{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.board{flex:1;display:flex;flex-direction:column;gap:6px;padding:6px max(8px,env(safe-area-inset-left)) 0 max(8px,env(safe-area-inset-left));padding-top:max(6px,env(safe-area-inset-top));min-height:0}
.brow{flex:1;display:flex;gap:6px;min-height:0}
.zone{position:relative;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#1a1612,#120f0c);padding:16px 8px 6px;display:flex;min-width:0}
.zone>label{position:absolute;top:-1px;left:10px;font:600 10px/1 Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);background:#1a1612;border:1px solid var(--line);border-top:0;padding:3px 7px;border-radius:0 0 6px 6px}
.zone.grow{flex:1}.z-loc{min-width:calc(var(--cw) + 18px)}
.zone>label{max-width:calc(100% - 14px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;align-items:flex-end;overflow-x:auto;overflow-y:hidden;min-width:0;padding-bottom:2px;scrollbar-width:thin}
.row.wrap{flex-wrap:wrap;overflow:visible;align-items:flex-start}
.pile{position:relative;width:var(--cw);height:var(--ch);border-radius:8px;overflow:hidden;cursor:pointer}
.pile .slot{padding:0}.pile .empty{width:100%;height:100%;border:1px dashed var(--line);border-radius:8px}
.z-pile{flex:none}
.hand{position:fixed;left:8px;right:8px;bottom:58px;z-index:20;background:#16120fee;border:1px solid var(--gold);border-radius:14px;padding:18px 10px 10px;backdrop-filter:blur(6px)}
.hand>label{position:absolute;top:-1px;left:12px;font:600 10px Figtree;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.log{position:fixed;left:8px;top:8px;bottom:62px;width:min(380px,70vw);z-index:25;overflow-y:auto;background:#120f0cf2;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px}
.log p{margin:0 0 6px;color:var(--mut)}.log .phase{color:var(--gold);font-weight:600;margin-top:10px}.log .bad{color:#f0a196}.log .good{color:#9fd8a5}.log .enc{color:#f3c9a0}.log .play{color:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));min-height:56px}
.bar .thr{position:static;display:flex;align-items:baseline;gap:5px;font:700 22px Cinzel,serif;color:#ffd9d2;background:#3a1512;border:1px solid var(--red);border-radius:10px;padding:2px 10px;box-shadow:none}
.bar .thr small{font:500 11px Figtree;color:#e8b0a6}
.ph{font-weight:600;white-space:nowrap}
.wt{flex:1;color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.hb{margin-left:auto;padding:0 12px}.wt+.gold+.hb{margin-left:0}
.modal{position:fixed;inset:0;z-index:40;background:#000a;display:grid;place-items:center;padding:12px}
.box{display:flex;flex-direction:column;background:var(--pan);border:1px solid #4a4034;border-radius:16px;padding:16px 18px;width:min(900px,100%);max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 20px 60px #000}
.box h3{margin:0;font:700 clamp(17px,2.4vw,22px)/1.2 Figtree}.box p{margin:8px 0}
.ph2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.pbody{flex:1 1 auto;min-height:0;overflow:auto;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.big{--ch:min(300px,46dvh);--cw:calc(var(--ch)*.716)}.big.sm{--ch:min(200px,30dvh)}
.picks{min-height:0}
.picks{--ch:min(170px,32dvh);--cw:calc(var(--ch)*.716);gap:12px;flex:1}
.pk{display:grid;gap:4px;justify-items:center}.pk small{color:var(--mut);font-size:13px}
.ztext{flex:1 1 260px;font-size:15px}.ztext i{color:var(--mut);font-style:normal;display:block}.zn{font:700 20px Cinzel,serif}
.ztext .sh{color:#e9a99f;font-style:italic}.cur{color:var(--gold)}
.btns{flex:none;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.btns .muted{margin-right:auto}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.fld label{display:block;color:var(--mut);font-weight:600;margin-bottom:6px}
.seg{display:flex;gap:4px;background:#2b2520;border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;min-height:44px}.seg button.on{background:#14110e;font-weight:700}.seg button:disabled{color:#665e54;cursor:default}
.dpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:10px}
.dp{display:grid;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#14110e;min-height:56px}
.dp small{color:var(--mut)}.dp.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}.dp:disabled{opacity:.35;cursor:default}
.end{text-align:center;max-width:460px}.end h3{font:700 40px Cinzel,serif}.end.win h3{color:var(--gold)}.end.lose h3{color:#f0a196}.end .btns{justify-content:center}
pre{white-space:pre-wrap;font-size:12px;color:var(--mut)}
.rotate{display:none}
@media (orientation:portrait) and (max-width:820px){
  .is-board .rotate{display:flex;position:fixed;inset:0;z-index:60;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mut);gap:10px}
  .is-board .rotate b{color:var(--ink);font-size:20px}}
@media (max-height:500px){.board{gap:4px}.zone{padding:14px 6px 4px}.bar{min-height:48px}.ph{font-size:14px}.wt{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>

om your hand and reduce the cost to play it by 1 (to a minimum of 1). Then, you may raise your threat by 1 to give that ally +1 [attack] and +1 [defense] until the end of the round.","back":"player"},"e73ef9d3-e2a1-400b-9ed7-bfdfd0a3bc2a":{"name":"Wait no Longer","img":"e73ef9d3-e2a1-400b-9ed7-bfdfd0a3bc2a.jpg","type":"Event","sphere":"Tactics","cost":2,"text":"Response: At the beginning of the staging step, search the top 5 cards of the encounter deck for an enemy and put it into play engaged with you. Then, reveal 1 less encounter card this phase (to a minimum of 0). Shuffle the encounter deck. ","back":"player"},"0916b82a-068e-4ca3-9554-f589a58e82fe":{"name":"Riddermark Knight","img":"0916b82a-068e-4ca3-9554-f589a58e82fe.jpg","type":"Ally","sphere":"Tactics","traits":["Rohan","Warrior"],"cost":2,"a":2,"hp":2,"text":"Response: After Riddermark Knight is declared as an attacker, it gets +2 [attack] for this attack. At the end of this attack, discard Riddermark Knight.","back":"player"},"ae807a4c-d656-42a1-bf2c-024eaffc9fc6":{"name":"Oath of Eorl","img":"ae807a4c-d656-42a1-bf2c-024eaffc9fc6.jpg","type":"Event","sphere":"Tactics","cost":3,"text":"Play only if you control a unique character with the Rohan trait and another unique character with the Gondor trait. Response: At the beginning of the combat phase, you resolve the step in which you attack enemies before resolving enemy attacks this phase. (Each other player resolves the combat phase as normal after you resolve your attacks.)","back":"player"},"4cca8984-2e4e-4df2-ac96-86af18b2a961":{"name":"Lothíriel","img":"4cca8984-2e4e-4df2-ac96-86af18b2a961.jpg","type":"Hero","sphere":"Spirit","traits":["Gondor","Noble"],"unique":true,"cost":8,"w":3,"a":1,"d":1,"hp":3,"text":"If Éomer is in play, Lothiriel gains the Rohan trait. Response: After Lothiriel commits to a quest, choose an ally in your hand. If that ally shares a Trait with her, put that ally into play exhausted and committed to the quest. At the end of the ph const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

// Cartas com regras implementadas (o resto da coleção fica bloqueado)
const IMPLEMENTED=new Set(['Éomer','Lothíriel','Hirgon','Horseback Archer','Feint','A Test of Will','Gandalf','The Red Arrow','Wait no Longer','Riddermark Knight','Oath of Eorl','War Axe','Horn of the Mark','The Muster of Rohan','Westfold Lancer','Westfold Horse-Breaker','Escort from Edoras','Éomund','Ancient Mathom','Astonishing Speed','Guthlaf','West Road Traveller','Forth Eorlingas!','Westfold Outrider','Westfold Horse-breeder','Firefoot']);

function traitsOf(c){const t=[...(c.d.traits||[])];if(N(c)==='Lothíriel'&&G&&chars().some(x=>N(x)==='Éomer'))t.push('Rohan');return t}
const hasTrait=(c,t)=>traitsOf(c).includes(t);
function attBonus(a,c,s){const n=N(a);
  if(n==='The Red Arrow'&&s==='w')return 1;
  if(n==='War Axe'&&s==='a')return c.att.filter(x=>RESTRICTED.includes(N(x))).length;
  if(n==='Firefoot'&&s==='a')return N(c)==='Éomer'?2:1;
  return 0}
function stat(c,s){
  let v=c.d[s]||0;
  for(const m of c.mods)if(m.s===s)v+=m.v;
  for(const a of c.att)v+=attBonus(a,c,s);
  for(const e of G.effects)v+=e.fn(c,s)||0;
  if(N(c)==='Escort from Edoras'&&s==='w'&&c.committed)v+=2;
  if(N(c)==='Chieftan Ufthak'&&s==='a')v+=2*c.res;
  return Math.max(0,v)}
const stagingThreat=()=>G.staging.reduce((t,c)=>t+(isEnemy(c)||isLoc(c)?stat(c,'thr'):0),0);
const questWill=()=>chars().filter(c=>c.committed).reduce((t,c)=>t+stat(c,'w'),0);

async function pick(title,cands,o={}){if(!cands.length)return[];const min=Math.min(o.min??1,cands.length);return ask({kind:'pick',title,text:o.text||'',cands,min,max:o.max??1,stat:o.stat,card:o.card})}
async function pick1(title,cands,o={}){return(await pick(title,cands,{...o,min:1,max:1}))[0]}
const yesno=(title,text,card)=>ask({kind:'buttons',title,text,card,options:[{label:'Sim',value:true,primary:true},{label:'Não',value:false}]});
const show=(title,card,text)=>ask({kind:'buttons',title,text,card,options:[{label:'Continuar',value:1,primary:true}]});

function draw(n,why=''){
  if(activeName()==='Enchanted Stream'){log('Enchanted Stream está ativa: não podes comprar cartas.');return 0}
  let k=0;for(let i=0;i<n&&G.deck.length;i++){G.hand.push(G.deck.shift());k++}
  if(k)log(`Compras ${k} carta${k>1?'s':''}${why}.`);else if(n)log('O teu baralho está vazio.');
  return k}
function checkLose(){
  if(G.threat>=50)throw new GameOver(false,'A tua ameaça chegou a 50.');
  if(!G.heroes.length)throw new GameOver(false,'Todos os teus heróis foram destruídos.')}
function raiseThreat(n,why){if(n<=0)return;G.threat+=n;log(`Ameaça +${n}${why?' ('+why+')':''} → ${G.threat}.`,'bad');checkLose()}
function lowerThreat(n,why){G.threat=Math.max(0,G.threat-n);log(`Ameaça −${n}${why?' ('+why+')':''} → ${G.threat}.`,'good')}
const spawnInPlay=()=>enemiesInPlay().some(e=>N(e)==="Ungoliant's Spawn");
function checkWin(){
  const q=G.quest;if(!q)return;
  if(q.id===QPATH&&G.flags.spawnDead)throw new GameOver(true,"Encontraste e derrotaste Ungoliant's Spawn. A mensagem chega a Lórien!");
  if(q.id===QBEORN&&G.qprog>=10&&!spawnInPlay())throw new GameOver(true,"Completaste Beorn's Path e saíste de Mirkwood!")}

function hostOf(a){return[...chars(),G.active,...G.staging].find(h=>h&&h.att.includes(a))}
function discardAttachment(a){const h=hostOf(a);if(h)h.att=h.att.filter(x=>x!==a);const enc=a.d.back==='encounter';resetCard(a);(enc?G.ediscard:G.discard).push(a);log(`${N(a)} é descartado.`)}
const myAttachments=(list=chars())=>list.flatMap(c=>c.att.filter(a=>a.d.back!=='encounter'));

async function damage(c,n,why){
  if(n<=0||!isChar(c))return;
  c.dmg+=n;log(`${N(c)} sofre ${n} de dano${why?' ('+why+')':''}.`,'bad');
  if(c.dmg>=stat(c,'hp')){log(`${N(c)} é destruído.`,'bad');await leavePlay(c)}}
async function leavePlay(c,dest='discard'){
  if(!isChar(c))return;
  const tr=traitsOf(c);
  G.heroes=G.heroes.filter(x=>x!==c);G.allies=G.allies.filter(x=>x!==c);
  for(const a of[...c.att])discardAttachment(a);
  resetCard(c);
  if(dest==='deck'){G.deck.push(c);shuffle(G.deck)}else G.discard.push(c);
  checkLose();
  const eo=G.heroes.find(h=>N(h)==='Éomer');
  if(eo&&!G.flags.eomer){G.flags.eomer=true;eo.mods.push({s:'a',v:2,u:'round'});log('Éomer: +2 ataque até ao fim da ronda.','good')}
  for(const h of G.heroes){const horn=h.att.find(a=>N(a)==='Horn of the Mark'&&!a.exh);
    if(horn&&traitsOf(h).some(t=>tr.includes(t))){horn.exh=true;log('Horn of the Mark é esgotado.');draw(1)}}
  if(N(c)==='Éomund'){for(const x of chars())if(hasTrait(x,'Rohan'))x.exh=false;log('Éomund: todas as personagens Rohan preparam.','good')}
  H.render()}
async function damageEnemy(e,n,why){
  if(n<=0||!enemiesInPlay().includes(e))return;
  e.dmg+=n;log(`${N(e)} sofre ${n} de dano${why?' ('+why+')':''}.`);
  if(e.dmg>=stat(e,'hp'))await destroyEnemy(e)}
async function destroyEnemy(e){
  G.staging=G.staging.filter(x=>x!==e);G.engaged=G.engaged.filter(x=>x!==e);
  for(const s of e.shadow)G.ediscard.push(resetCard(s));
  const vp=e.d.vp;resetCard(e);(vp?G.victory:G.ediscard).push(e);
  log(`${N(e)} é derrotado!${vp?' (+'+vp+' pontos de vitória)':''}`,'good');
  if(N(e)==="Ungoliant's Spawn"&&G.quest.id===QPATH)G.flags.spawnDead=true;
  checkWin()}

// ---------- custos ----------
function costOf(c,red=0){let v=c.d.cost||0;
  if(N(c)==='Guthlaf'&&G.heroes.some(h=>hasTrait(h,'Rohan')))v=Math.max(0,v-1);
  if(red&&v>0)v=Math.max(1,v-red);return v}
function payers(c){const sp=c.d.sphere;return G.heroes.filter(h=>sp==='Neutral'||h.d.sphere===sp||(N(c)==='The Muster of Rohan'&&hasTrait(h,'Rohan')))}
const canAfford=(c,red=0)=>payers(c).reduce((t,h)=>t+h.res,0)>=costOf(c,red);
function pay(c,cost){let left=cost;for(const h of payers(c).sort((a,b)=>b.res-a.res)){const t=Math.min(h.res,left);h.res-=t;left-=t}}
const uniqueBlocked=c=>c.d.unique&&chars().some(x=>N(x)===N(c));
function attachTargets(c){const n=N(c),ok=h=>!(RESTRICTED.includes(n)&&h.att.filter(a=>RESTRICTED.includes(N(a))).length>=2);
  if(n==='The Red Arrow')return G.heroes.filter(h=>hasTrait(h,'Gondor')&&ok(h));
  if(n==='War Axe')return chars().filter(h=>h.d.sphere==='Tactics'&&!h.att.some(a=>N(a)==='War Axe')&&ok(h));
  if(n==='Horn of the Mark')return G.heroes.filter(h=>hasTrait(h,'Rohan')&&ok(h));
  if(n==='Firefoot')return G.heroes.filter(h=>(h.d.sphere==='Tactics'||hasTrait(h,'Rohan'))&&ok(h));
  if(n==='Ancient Mathom')return[G.active,...G.staging.filter(isLoc)].filter(Boolean);
  return[]}
const EVT={'Feint':{t:'combat',ok:()=>G.engaged.length>0},'Astonishing Speed':{t:'action'},'Forth Eorlingas!':{t:'combat'},'The Muster of Rohan':{t:'planning'}};
const RESP={'A Test of Will':'Resposta: oferecida quando é revelada uma carta com "When Revealed".','Wait no Longer':'Resposta: oferecida no início do passo de preparação.','Oath of Eorl':'Resposta: oferecida no início da fase de combate.'};
function canPlay(c){
  const w=G.window;if(!w||!G.hand.includes(c))return false;
  const t=c.d.type;
  if(t==='Ally'||t==='Attachment'){if(w!=='planning'||uniqueBlocked(c))return false;if(t==='Attachment'&&!attachTargets(c).length)return false}
  else if(t==='Event'){const e=EVT[N(c)];if(!e)return false;
    if(e.t==='planning'&&w!=='planning')return false;if(e.t==='combat'&&w!=='combat')return false;if(e.ok&&!e.ok())return false}
  return canAfford(c)}
function canResp(n){const c=G.hand.find(x=>N(x)===n);if(!c||!canAfford(c))return false;
  if(n==='Oath of Eorl')return chars().some(x=>x.d.unique&&hasTrait(x,'Rohan'))&&chars().some(x=>x.d.unique&&hasTrait(x,'Gondor'));
  return true}
function playResponse(n){const c=G.hand.find(x=>N(x)===n);G.hand=G.hand.filter(x=>x!==c);pay(c,costOf(c));G.discard.push(c);log(`Jogas ${n}.`,'play')}

async function playCard(c,{red=0}={}){
  const cost=costOf(c,red);
  let tg=null;
  if(c.d.type==='Attachment')tg=await pick1(`Anexar ${N(c)} a…`,attachTargets(c));
  G.hand=G.hand.filter(x=>x!==c);pay(c,cost);
  log(`Jogas ${N(c)} (custo ${cost}).`,'play');
  if(c.d.type==='Ally')await enterPlay(c,true);
  else if(tg){tg.att.push(c);log(`${N(c)} fica anexado a ${N(tg)}.`)}
  else if(c.d.type==='Event'){G.discard.push(c);await EVENTS[N(c)](c)}}

async function enterPlay(c,fromHand=false){
  resetCard(c);G.allies.push(c);log(`${N(c)} entra em jogo.`);const n=N(c);
  if(n==='Gandalf'){const ens=enemiesInPlay();
    const o=await ask({kind:'buttons',title:'Gandalf entra em jogo',text:'Escolhe 1 efeito:',card:c,options:[{label:'Comprar 3 cartas',value:'d',primary:true},...(ens.length?[{label:'4 de dano a 1 inimigo',value:'x'}]:[]),{label:'Reduzir ameaça em 5',value:'t'}]});
    if(o==='d')draw(3);else if(o==='t')lowerThreat(5,'Gandalf');else{const e=await pick1('Gandalf: escolhe o inimigo',ens,{stat:'hpleft'});await damageEnemy(e,4,'Gandalf')}}
  if(n==='Westfold Horse-breeder'){const m=G.deck.slice(0,10).filter(x=>(x.d.traits||[]).includes('Mount'));
    if(m.length){const r=await pick('Westfold Horse-breeder: junta um anexo Mount à mão',m,{min:0,max:1});if(r[0]){G.deck=G.deck.filter(x=>x!==r[0]);G.hand.push(r[0]);log(`${N(r[0])} vai para a tua mão.`)}}
    else log('Westfold Horse-breeder: não há Mount nas 10 do topo.');shuffle(G.deck)}
  if(n==='West Road Traveller'&&fromHand&&G.active&&G.staging.some(isLoc)){
    const r=await pick('West Road Traveller: troca a localização ativa por outra da área de preparação (opcional)',G.staging.filter(isLoc),{min:0,max:1});
    if(r[0]){G.staging=G.staging.filter(x=>x!==r[0]);G.staging.push(G.active);G.active=r[0];log(`${N(r[0])} passa a ser a localização ativa.`)}}
  H.render()}

const EVENTS={
  'Feint':async()=>{const e=await pick1('Feint: escolhe um inimigo enfrentado — não te ataca nesta fase',G.engaged);e.feint=true;log(`${N(e)} não ataca nesta fase.`)},
  'Astonishing Speed':async()=>{G.effects.push({u:'phase',fn:(c,s)=>s==='w'&&isChar(c)&&hasTrait(c,'Rohan')?2:0});log('Personagens Rohan +2 força de vontade nesta fase.','good')},
  'Forth Eorlingas!':async()=>{G.flags.forth=true;log('Heróis Rohan podem atacar inimigos na área de preparação nesta fase.','good')},
  'The Muster of Rohan':async()=>{const al=G.deck.slice(0,10).filter(x=>x.d.type==='Ally'&&(x.d.traits||[]).includes('Rohan'));
    if(al.length){const r=await pick('The Muster of Rohan: escolhe até 4 aliados Rohan para pôr em jogo',al,{min:0,max:4});
      for(const c of r){if(uniqueBlocked(c))continue;G.deck=G.deck.filter(x=>x!==c);await enterPlay(c);c.muster=true}}
    else log('Não há aliados Rohan nas 10 do topo.');shuffle(G.deck)}};

const ABIL={
  'Westfold Horse-Breaker':{label:'Descartar: preparar um herói',ok:()=>G.heroes.some(h=>h.exh),
    run:async c=>{const h=await pick1('Escolhe um herói para preparar',G.heroes.filter(h=>h.exh));await leavePlay(c);h.exh=false;log(`${N(h)} prepara.`,'good')}},
  'Westfold Outrider':{label:'Descartar: enfrentar um inimigo',ok:()=>G.staging.some(isEnemy),
    run:async c=>{const e=await pick1('Escolhe o inimigo a enfrentar',G.staging.filter(isEnemy));await leavePlay(c);await engage(e)}}};
const canUse=c=>!!(G.window&&G.allies.includes(c)&&ABIL[N(c)]&&ABIL[N(c)].ok(c));

async function actionWindow(label,kind){
  for(;;){G.window=kind;
    const r=await ask({kind:'window',title:label});
    G.window=null;
    if(!r||r==='pass')break;
    if(r.type==='play'&&canPlayIn(r.c,kind))await playCard(r.c);
    else if(r.type==='abil')await ABIL[N(r.c)].run(r.c)}
  G.window=null}
function canPlayIn(c,k){const w=G.window;G.window=k;const ok=canPlay(c);G.window=w;return ok}

// ---------- encontro ----------
async function engage(e){
  G.staging=G.staging.filter(x=>x!==e);if(!G.engaged.includes(e))G.engaged.push(e);
  log(`${N(e)} está agora enfrentado contigo.`,'enc');
  if(N(e)==='Forest Spider'){e.mods.push({s:'a',v:1,u:'round'});log('Forest Spider: +1 ataque até ao fim da ronda.')}
  if(N(e)==='Hummerhorns'&&G.heroes.length){const h=await pick1('Hummerhorns: escolhe um herói para sofrer 5 de dano',G.heroes);await damage(h,5,'Hummerhorns')}}

const WR={
  'King Spider':async()=>{const r=chars().filter(c=>!c.exh);if(r.length){const c=await pick1('King Spider: escolhe e esgota 1 personagem',r);c.exh=true;log(`${N(c)} é esgotado.`)}},
  "Ungoliant's Spawn":async()=>{const cs=chars().filter(c=>c.committed);for(const c of cs)c.mods.push({s:'w',v:-1,u:'phase'});if(cs.length)log('Personagens em missão: −1 força de vontade nesta fase.','bad')},
  'Dol Guldur Orcs':async()=>{const r=chars().filter(c=>c.committed);if(r.length){const c=await pick1('Dol Guldur Orcs: escolhe uma personagem em missão para sofrer 2 de dano',r);await damage(c,2,'Dol Guldur Orcs')}},
  'Black Forest Bats':async()=>{const r=chars().filter(c=>c.committed);if(r.length){const c=await pick1('Black Forest Bats: retira 1 personagem da missão',r);c.committed=false;log(`${N(c)} sai da missão (não prepara).`)}},
  'Eyes of the Forest':async()=>{const ev=G.hand.filter(c=>c.d.type==='Event');G.hand=G.hand.filter(c=>c.d.type!=='Event');G.discard.push(...ev);log(`Descartas ${ev.length} evento(s) da mão.`,'bad')},
  'Caught in a Web':async c=>{const h=await pick1('Caught in a Web: escolhe o herói que recebe esta condição',G.heroes);h.att.push(c);c.host=h;log(`Caught in a Web fica anexado a ${N(h)}.`,'bad')},
  'Driven by Shadow':async()=>{const s=G.staging.filter(x=>isEnemy(x)||isLoc(x));if(!s.length)return'surge';
    G.effects.push({u:'phase',fn:(c,st)=>st==='thr'&&s.includes(c)&&G.staging.includes(c)?1:0});log('Cada inimigo e localização na preparação: +1 ameaça nesta fase.','bad')},
  "The Necromancer's Reach":async()=>{for(const c of chars().filter(c=>c.exh))await damage(c,1,"Necromancer's Reach")}};

async function reveal(){
  if(!G.edeck.length){if(!G.ediscard.length){log('O baralho de encontro está vazio.');return}
    G.edeck=shuffle(G.ediscard.map(resetCard));G.ediscard=[];log('O descarte de encontro é baralhado e forma um novo baralho.')}
  const c=G.edeck.shift();log(`Revelada: ${N(c)}.`,'enc');
  await show('Carta de encontro revelada',c);
  const wr=WR[N(c)];let cancel=false;
  if(wr&&canResp('A Test of Will')){cancel=await yesno('Jogar A Test of Will?',`Cancela o efeito "When Revealed" de ${N(c)} (custa 1 recurso Spirit).`,c);if(cancel){playResponse('A Test of Will');log('Efeito cancelado.','good')}}
  if(isEnemy(c)||isLoc(c))G.staging.push(c);
  let surge=false;
  if(wr&&!cancel)surge=(await wr(c))==='surge';
  if(c.d.type==='Treachery'&&!c.host)G.ediscard.push(c);
  H.render();
  if(surge){log('Surge: revela outra carta.','enc');await reveal()}}

const SHADOW={
  'King Spider':async(e,d,u)=>{for(let i=0;i<(u?2:1);i++){const r=chars().filter(c=>!c.exh);if(!r.length)break;const c=await pick1('Sombra: escolhe e esgota 1 personagem',r);c.exh=true}},
  'Hummerhorns':async(e,d,u)=>{for(const c of chars())await damage(c,u?2:1,'sombra')},
  "Ungoliant's Spawn":async(e,d,u)=>raiseThreat(u?8:4,'sombra'),
  'Dol Guldur Orcs':async(e,d,u)=>{e.mods.push({s:'a',v:u?3:1,u:'attack'});log(`${N(e)} +${u?3:1} ataque.`,'bad')},
  'Forest Spider':async()=>{const at=myAttachments();if(at.length){const a=await pick1('Sombra: descarta 1 anexo que controlas',at);discardAttachment(a)}},
  'East Bight Patrol':async(e,d,u)=>{e.mods.push({s:'a',v:1,u:'attack'});log(`${N(e)} +1 ataque.`,'bad');if(u)raiseThreat(3,'sombra')},
  'Driven by Shadow':async(e,d,u)=>{if(u){for(const a of myAttachments())discardAttachment(a)}
    else if(d&&myAttachments([d]).length){const a=await pick1('Sombra: descarta 1 anexo do defensor',myAttachments([d]));discardAttachment(a)}}};

function dealShadow(e){if(!G.edeck.length)return;const s=G.edeck.shift();e.shadow.push(s)}

// ---------- missão ----------
async function placeProgress(n){
  if(G.active&&n>0){const L=G.active,t=Math.min(n,L.d.qp-L.prog);L.prog+=t;n-=t;log(`${t} progresso em ${N(L)}.`);if(L.prog>=L.d.qp)await explore()}
  if(n>0){G.qprog+=n;log(`${n} progresso na missão (${G.qprog}/${G.quest.d.qp}).`,'good')}
  await checkQuest()}
async function checkQuest(){
  const q=G.quest;
  if(q.id===Q1&&G.qprog>=8)await advance(Q2);
  else if(q.id===Q2&&G.qprog>=2){log('A Fork in the Road: avanças para um dos "A Chosen Path", ao acaso.');await advance(Math.random()<.5?QPATH:QBEORN)}
  else checkWin()}
async function advance(id){
  G.qprog=0;G.quest=mk(id,0);H.render();await show('Nova etapa da missão',G.quest);
  G.quest=mk(id,1);log(`Etapa ${G.quest.d.cost}: ${N(G.quest)}.`,'phase');await show('Etapa virada',G.quest);
  if(id===QPATH){const pool=[...G.edeck,...G.ediscard].filter(c=>(c.d.traits||[]).includes('Spider'));
    if(pool.length){const c=await pick1("Don't Leave the Path!: escolhe 1 carta Spider para a área de preparação",pool);
      G.edeck=G.edeck.filter(x=>x!==c);G.ediscard=G.ediscard.filter(x=>x!==c);resetCard(c);G.staging.push(c);shuffle(G.edeck);log(`${N(c)} é adicionado à área de preparação.`,'enc')}}
  checkWin()}
async function explore(){
  const L=G.active;G.active=null;log(`${N(L)} foi explorada.`,'good');
  const math=L.att.some(a=>N(a)==='Ancient Mathom');for(const a of[...L.att]){L.att=L.att.filter(x=>x!==a);G.discard.push(resetCard(a))}
  resetCard(L);G.ediscard.push(L);
  if(math){log('Ancient Mathom:');draw(3)}
  if(N(L)==='Mountains of Mirkwood'&&G.deck.length){const top=G.deck.slice(0,5);
    const r=await pick('Mountains of Mirkwood: junta à mão 1 das 5 cartas do topo (opcional)',top,{min:0,max:1});
    if(r[0]){G.deck=G.deck.filter(x=>x!==r[0]);G.hand.push(r[0]);log(`${N(r[0])} vai para a tua mão.`)}shuffle(G.deck)}}

async function questSuccess(com){
  const hg=com.find(c=>N(c)==='Hirgon'&&isHero(c));
  if(hg){const al=G.hand.filter(c=>c.d.type==='Ally'&&c.d.sphere==='Tactics'&&!uniqueBlocked(c)&&canAfford(c,1));
    if(al.length){const r=await pick('Hirgon: joga um aliado Tactics da mão com custo −1 (mín. 1)',al,{min:0,max:1});
      if(r[0]){const a=r[0];await playCard(a,{red:1});
        if(G.allies.includes(a)&&await yesno('Hirgon',`Aumentar a ameaça em 1 para dar +1 ataque e +1 defesa a ${N(a)} até ao fim da ronda?`,a)){raiseThreat(1,'Hirgon');a.mods.push({s:'a',v:1,u:'round'},{s:'d',v:1,u:'round'})}}}}
  for(const l of com.filter(c=>N(c)==='Westfold Lancer'&&G.allies.includes(c))){const t=G.staging.filter(e=>isEnemy(e)&&!e.d.unique);if(!t.length)break;
    const r=await pick('Westfold Lancer: descarta-o para dar 2 de dano a um inimigo não-único na preparação (opcional)',t,{min:0,max:1,stat:'hpleft'});
    if(r[0]){await leavePlay(l);await damageEnemy(r[0],2,'Westfold Lancer')}}
  for(const h of com.filter(isHero)){const ra=h.att.find(a=>N(a)==='The Red Arrow');
    if(ra&&G.threat>=40&&await yesno('The Red Arrow (Valour)','Põe The Red Arrow na vitória para procurar um aliado nas 5 cartas do topo e pô-lo em jogo?',ra)){
      h.att=h.att.filter(a=>a!==ra);G.victory.push(resetCard(ra));
      const al=G.deck.slice(0,5).filter(c=>c.d.type==='Ally'&&!uniqueBlocked(c));
      if(al.length){const c=await pick1('The Red Arrow: escolhe o aliado',al);G.deck=G.deck.filter(x=>x!==c);await enterPlay(c)}shuffle(G.deck)}}}

// ---------- fases ----------
function endPhase(){
  const all=[...chars(),...G.staging,...G.engaged,G.active].filter(Boolean);
  for(const c of all){c.mods=c.mods.filter(m=>m.u!=='phase'&&m.u!=='attack');c.feint=false}
  G.effects=G.effects.filter(e=>e.u!=='phase');G.flags.forth=false}
function phase(name){endPhase();G.phase=name;log(`Ronda ${G.round} · ${name}`,'phase')}

async function resourcePhase(){phase('Recursos');for(const h of G.heroes)h.res++;log('Cada herói recebe 1 recurso.');draw(1)}
async function planningPhase(){phase('Planeamento');H.openHand&&H.openHand();await actionWindow('Planeamento: joga aliados, anexos e eventos','planning')}
async function questPhase(){
  phase('Missão');
  const ready=chars().filter(c=>!c.exh);
  const com=await pick(`Missão: escolhe as personagens a comprometer (ameaça na preparação: ${stagingThreat()})`,ready,{min:0,max:ready.length,stat:'w'});
  for(const c of com){c.committed=true;c.exh=true}
  log(com.length?`Comprometes ${com.map(N).join(', ')}.`:'Não comprometes ninguém.');
  const lo=com.find(c=>N(c)==='Lothíriel');
  if(lo){const lt=traitsOf(lo);const al=G.hand.filter(c=>c.d.type==='Ally'&&(c.d.traits||[]).some(t=>lt.includes(t))&&!uniqueBlocked(c));
    if(al.length){const r=await pick('Lothíriel: põe em jogo um aliado da mão que partilhe um traço com ela (esgotado e em missão)',al,{min:0,max:1});
      if(r[0]){G.hand=G.hand.filter(x=>x!==r[0]);await enterPlay(r[0]);r[0].exh=true;r[0].committed=true;G.flags.lothAlly=r[0]}}}
  await actionWindow('Missão: ações antes da preparação','quest');
  G.phase='Missão · Preparação';
  let n=1;
  if(canResp('Wait no Longer')&&await yesno('Wait no Longer','Procurar um inimigo nas 5 cartas do topo do baralho de encontro, enfrentá-lo e revelar menos 1 carta?')){
    playResponse('Wait no Longer');const t=G.edeck.slice(0,5).filter(isEnemy);
    if(t.length){const e=await pick1('Wait no Longer: escolhe o inimigo',t);G.edeck=G.edeck.filter(x=>x!==e);await engage(e)}
    shuffle(G.edeck);n=0}
  for(let i=0;i<n;i++)await reveal();
  await actionWindow(`Missão: força de vontade ${questWill()} contra ameaça ${stagingThreat()}. Ações antes de resolver`,'quest');
  const W=questWill(),T=stagingThreat(),com2=chars().filter(c=>c.committed);
  log(`Resolução: força de vontade ${W} contra ameaça ${T}.`,'phase');
  if(W>T){await placeProgress(W-T);await questSuccess(com2)}
  else if(T>W)raiseThreat(T-W,'missão falhada');
  else log('Empate: nada acontece.');
  for(const c of G.allies.filter(c=>c.committed&&N(c)==='Escort from Edoras')){log('Escort from Edoras é descartado.');await leavePlay(c)}
  for(const c of chars())c.committed=false;
  const la=G.flags.lothAlly;G.flags.lothAlly=null;
  if(la&&G.allies.includes(la)){log(`${N(la)} é baralhado de volta no teu baralho (Lothíriel).`);await leavePlay(la,'deck')}}
const canTravel=L=>N(L)==='Great Forest Web'?G.heroes.some(h=>!h.exh):N(L)==="Necromancer's Pass"?G.hand.length>=2:true;
async function travelPhase(){
  phase('Viagem');
  if(G.active){log(`${N(G.active)} continua ativa: não há viagem.`);return}
  const locs=G.staging.filter(isLoc).filter(canTravel);if(!locs.length)return;
  const L=(await pick('Viagem: escolhe uma localização para viajar (opcional)',locs,{min:0,max:1,stat:'qp'}))[0];if(!L)return;
  const n=N(L);
  if(n==='Great Forest Web'){const h=await pick1('Great Forest Web: esgota 1 herói para viajar',G.heroes.filter(h=>!h.exh));h.exh=true}
  if(n==="Necromancer's Pass")for(let i=0;i<2;i++){const c=G.hand.splice(Math.random()*G.hand.length|0,1)[0];G.discard.push(c);log(`Descartas ${N(c)} ao acaso.`,'bad')}
  if(n==='Mountains of Mirkwood'){log('Mountains of Mirkwood: revela a carta do topo do encontro.');await reveal()}
  G.staging=G.staging.filter(x=>x!==L);G.active=L;log(`Viajas para ${n}.`);
  if(n==='Old Forest Road'){const ex=chars().filter(c=>c.exh);if(ex.length){const r=await pick('Old Forest Road: prepara 1 personagem (opcional)',ex,{min:0,max:1});if(r[0]){r[0].exh=false;log(`${N(r[0])} prepara.`,'good')}}}
  if(n==='Forest Gate'&&await yesno('Forest Gate','Comprar 2 cartas?',L))draw(2)}
async function encounterPhase(){
  phase('Encontro');
  const en=G.staging.filter(isEnemy);
  if(en.length){const r=await pick(`Enfrentamento opcional (a tua ameaça: ${G.threat})`,en,{min:0,max:1,stat:'eng'});if(r[0])await engage(r[0])}
  for(;;){const c=sortEng(G.staging.filter(e=>isEnemy(e)&&e.d.eng<=G.threat));if(!c.length)break;
    log(`Verificação: ${N(c[0])} (custo ${c[0].d.eng}) ≤ ameaça ${G.threat}.`);await engage(c[0])}}
async function enemyAttack(e){
  if(N(e)==='Dol Guldur Beastmaster'){dealShadow(e);log('Dol Guldur Beastmaster recebe outra carta de sombra.')}
  const cands=chars().filter(c=>!c.exh);
  const r=await pick(`${N(e)} ataca com ${stat(e,'a')}. Escolhe um defensor (ou nenhum)`,cands,{min:0,max:1,stat:'d',card:e});
  const d=r[0]||null,u=!d;
  if(d){d.exh=true;log(`${N(d)} defende contra ${N(e)}.`)}else log(`${N(e)}: ataque sem defesa!`,'bad');
  for(const s of e.shadow){if(s.up)continue;s.up=true;H.render();await show('Carta de sombra',s,s.d.shadow||'Sem efeito de sombra.');const f=SHADOW[N(s)];if(f&&s.d.shadow)await f(e,d,u)}
  if(G.engaged.includes(e)){const atk=stat(e,'a');
    if(d){if(isChar(d)){const dm=atk-stat(d,'d');if(dm>0)await damage(d,dm,N(e));else log(`${N(d)} absorve o ataque.`)}}
    else if(G.heroes.length){const h=await pick1(`Ataque sem defesa: ${atk} de dano a um herói`,G.heroes,{stat:'hpleft'});await damage(h,atk,`${N(e)}, sem defesa`)}
    if(N(e)==='Chieftan Ufthak'){e.res++;log('Chieftain Ufthak recebe 1 recurso (+2 ataque cada).','bad')}}
  for(const c of[...chars(),e])c.mods=c.mods.filter(m=>m.u!=='attack');
  checkLose()}
async function playerAttacks(){
  for(;;){
    const ready=chars().filter(c=>!c.exh);if(!ready.length)break;
    const rohanHeroes=ready.filter(c=>isHero(c)&&hasTrait(c,'Rohan'));
    const targets=[...G.engaged,...(G.flags.forth&&rohanHeroes.length?G.staging.filter(isEnemy):[])];
    if(!targets.length)break;
    const e=(await pick('Os teus ataques: escolhe um inimigo para atacar (ou termina)',targets,{min:0,max:1,stat:'hpleft'}))[0];if(!e)break;
    const pool=G.staging.includes(e)?rohanHeroes:ready;
    const A=await pick(`Atacantes contra ${N(e)} (defesa ${stat(e,'d')}, vida ${stat(e,'hp')-e.dmg})`,pool,{min:0,max:pool.length,stat:'a',card:e});
    if(!A.length)continue;
    for(const c of A)c.exh=true;
    for(const k of A.filter(c=>N(c)==='Riddermark Knight'))if(await yesno('Riddermark Knight','+2 ataque neste ataque? (é descartado no fim do ataque)',k)){k.mods.push({s:'a',v:2,u:'attack'});k.rk=true}
    const atk=A.reduce((t,c)=>t+stat(c,'a'),0),dm=Math.max(0,atk-stat(e,'d')),left=stat(e,'hp')-e.dmg;
    log(`Ataque ${atk} contra defesa ${stat(e,'d')}: ${dm} de dano.`);
    let ex=0,ffT=null;
    if(A.length===1&&dm>left){const ff=A[0].att.find(a=>N(a)==='Firefoot'&&!a.exh);const o=G.engaged.filter(x=>x!==e&&!x.d.unique);
      if(ff&&o.length&&await yesno('Firefoot',`Esgotar Firefoot para passar ${dm-left} de dano em excesso a outro inimigo não-único?`,ff)){ff.exh=true;ex=dm-left;ffT=await pick1('Firefoot: escolhe o inimigo',o,{stat:'hpleft'})}}
    await damageEnemy(e,dm-ex,'ataque');if(ffT)await damageEnemy(ffT,ex,'Firefoot');
    for(const k of A.filter(c=>c.rk&&G.allies.includes(c))){log('Riddermark Knight é descartado.');await leavePlay(k)}
    for(const c of chars())c.mods=c.mods.filter(m=>m.u!=='attack')}}
async function combatPhase(){
  phase('Combate');
  if(!G.engaged.length){
    const fe=G.hand.find(c=>N(c)==='Forth Eorlingas!');
    if(!(fe&&G.staging.some(isEnemy)&&canPlayIn(fe,'combat')))return;
    await actionWindow('Combate: sem inimigos enfrentados (podes jogar Forth Eorlingas!)','combat');
    if(!G.engaged.length&&!G.flags.forth)return}
  let oath=false;
  if(G.engaged.length&&canResp('Oath of Eorl')&&await yesno('Oath of Eorl','Atacar primeiro, antes dos ataques inimigos nesta fase?')){playResponse('Oath of Eorl');oath=true}
  for(const e of sortEng(G.engaged))dealShadow(e);
  H.render();
  await actionWindow('Combate: ações antes dos ataques inimigos','combat');
  const enemyPhase=async()=>{for(const e of sortEng(G.engaged)){if(!G.engaged.includes(e))continue;if(e.feint){log(`${N(e)} não ataca (Feint).`);continue}await enemyAttack(e)}};
  if(oath){await playerAttacks();await enemyPhase()}
  else{await enemyPhase();if(G.engaged.length||G.flags.forth)await actionWindow('Combate: ações antes dos teus ataques','combat');await playerAttacks()}
  for(const e of G.engaged){G.ediscard.push(...e.shadow.map(resetCard));e.shadow=[]}}
async function refreshPhase(){
  phase('Restauro');
  for(const c of chars()){const web=c.att.find(a=>N(a)==='Caught in a Web');
    if(web&&c.exh){if(c.res>=2&&await yesno('Caught in a Web',`Pagar 2 recursos de ${N(c)} para o preparar?`,web)){c.res-=2;c.exh=false}else log(`${N(c)} não prepara (Caught in a Web).`,'bad')}
    else c.exh=false;
    for(const a of c.att)a.exh=false}
  raiseThreat(1,'fase de restauro');
  for(const c of G.allies.filter(c=>N(c)==='Gandalf')){log('Gandalf é descartado no fim da ronda.');await leavePlay(c)}
  for(const c of G.allies.filter(c=>c.muster)){log(`${N(c)} é descartado (The Muster of Rohan).`);await leavePlay(c)}
  for(const c of[...chars(),...G.staging,...G.engaged,G.active].filter(Boolean))c.mods=c.mods.filter(m=>m.u!=='round');
  G.effects=G.effects.filter(e=>e.u!=='round');G.flags.eomer=false}

// ---------- jogo ----------
function newGame(deck){
  UID=1;
  G={threat:0,heroes:[],allies:[],hand:[],deck:[],discard:[],edeck:[],ediscard:[],staging:[],active:null,engaged:[],victory:[],
     quest:null,qprog:0,round:0,phase:'Preparação do jogo',effects:[],flags:{},log:[],window:null,over:null,deckName:deck.name};
  G.heroes=deck.heroes.map(id=>mk(id));G.threat=G.heroes.reduce((t,h)=>t+(h.d.cost||0),0);
  for(const[id,q]of deck.cards)for(let i=0;i<q;i++)G.deck.push(mk(id));shuffle(G.deck);
  for(const[id,q,g]of PTM){if(g==='QuestDeck')continue;for(let i=0;i<q;i++)(g==='StagingArea'?G.staging:G.edeck).push(mk(id))}
  shuffle(G.edeck);G.quest=mk(Q1,0);return G}
async function runGame(){
  try{
    log(`Ameaça inicial ${G.threat}.`,'phase');H.render();
    await show('Passage Through Mirkwood',G.quest,'Preparação: Forest Spider e Old Forest Road são adicionados à área de preparação e o baralho de encontro é baralhado.');
    G.quest=mk(Q1,1);log('Etapa 1: Flies and Spiders.','phase');
    G.hand=G.deck.splice(0,6);H.render();
    const m=await ask({kind:'buttons',title:'Mão inicial',text:'Podes fazer mulligan uma vez: baralhar a mão de volta e comprar 6 novas cartas.',cards:G.hand,options:[{label:'Manter',value:'k',primary:true},{label:'Mulligan',value:'m'}]});
    if(m==='m'){G.deck.push(...G.hand);G.hand=[];shuffle(G.deck);G.hand=G.deck.splice(0,6);log('Fazes mulligan.')}
    for(;;){G.round++;await resourcePhase();await planningPhase();await questPhase();await travelPhase();await encounterPhase();await combatPhase();await refreshPhase()}
  }catch(e){
    if(e instanceof GameOver){G.over={win:e.win,msg:e.message};G.window=null;log(e.win?'Vitória! '+e.message:'Derrota. '+e.message,e.win?'good':'bad');H.render();H.onEnd()}
    else{console.error(e);G.error=String(e&&e.stack||e);H.render()}}}

function face(d,big){
  const col=SPH[d.sphere]||(d.type==='Enemy'?'#6d2a22':d.type==='Location'?'#4d5a3a':d.type==='Treachery'?'#4b3a5c':'#5b5145');
  const st=[];
  if(d.type==='Hero')st.push(['AME',d.cost]);else if(d.cost!=null&&d.type!=='Quest')st.push(['Custo',d.cost]);
  if(d.eng!=null)st.push(['Enf',d.eng]);if(d.thr!=null&&d.type!=='Hero')st.push(['AME',d.thr]);
  for(const[k,l]of[['w','FV'],['a','ATQ'],['d','DEF'],['hp','PV'],['qp','PM']])if(d[k]!=null)st.push([l,d[k]]);
  return `<div class="face" style="--sc:${col}"><b class="nm">${d.unique?'◆ ':''}${esc(d.name)}</b><i class="ty">${esc(TP[d.type]||d.type)}${d.sphere?' · '+esc(d.sphere):''}${d.type==='Quest'?' · etapa '+d.cost+(d.side||''):''}</i>
  <div class="st">${st.map(([l,v])=>`<span><small>${l}</small>${v}</span>`).join('')}</div>
  ${d.traits?.length?`<i class="tr">${esc(d.traits.join('. '))}.</i>`:''}${big||1?`<p class="tx">${esc(icon([d.kw,d.text].filter(Boolean).join(' ')))}</p>`:''}${big&&d.shadow?`<p class="tx sh">${esc(icon(d.shadow))}</p>`:''}</div>`}
const imgTag=(d,cls='')=>`<img class="${cls}" src="${IMGBASE+d.img}" alt="" loading="lazy" onerror="this.remove()">`;
const backTag=k=>`<div class="back ${k}"><span>${k==='encounter'?'Encontro':'Jogador'}</span><img src="${BACKS[k]}" alt="" onerror="this.remove()"></div>`;
function cardEl(c,o={}){
  const d=c.d,cls=['card',d.type==='Quest'?'wide':'',c.exh?'exh':'',c.committed?'com':'',o.hl?'hl':'',o.sel?'sel':''].join(' ');
  const b=[];
  if(c.res)b.push(`<em class="bd res">${c.res}</em>`);if(c.dmg)b.push(`<em class="bd dmg">${c.dmg}</em>`);if(c.prog)b.push(`<em class="bd prg">${c.prog}</em>`);
  if(c.committed)b.push('<em class="bd com">missão</em>');
  if(o.thr&&G)b.push(`<em class="bd thr">${stat(c,'thr')}</em>`);
  if(o.stats&&G&&isChar(c))b.push(`<em class="bd sts">${stat(c,'w')}·${stat(c,'a')}·${stat(c,'d')}</em>`);
  if(o.atk&&G)b.push(`<em class="bd atk">${stat(c,'a')} atq</em>`);
  if(o.note)b.push(`<em class="bd note">${esc(o.note)}</em>`);
  const att=(c.att||[]).map((a,i)=>`<div class="att" data-uid="${a.uid}" style="--i:${i}">${a.exh?'<i class="ax">esgotado</i>':''}<b>${esc(N(a))}</b>${imgTag(a.d)}</div>`).join('');
  const sh=(c.shadow||[]).map(s=>`<div class="shd" data-uid="${s.uid}">${s.up?`<b>${esc(N(s))}</b>${imgTag(s.d)}`:backTag('encounter')}</div>`).join('');
  return `<div class="slot ${c.exh?'exh':''} ${d.type==='Quest'?'wide':''}" style="--n:${(c.att||[]).length}">${att}<div class="${cls}" data-uid="${c.uid}">${face(d)}${imgTag(d)}${b.join('')}</div>${sh}</div>`}
function pile(list,k,label){return `<div class="pile" data-pile="${label}">${list.length?(k==='up'?cardEl(list[list.length-1]):backTag(k)):'<div class="empty"></div>'}<em class="bd cnt">${list.length}</em></div>`}
function allInst(){if(!G)return[];const z=[...G.heroes,...G.allies,...G.hand,...G.staging,...G.engaged,...G.discard,...G.ediscard,...G.victory,G.active,G.quest].filter(Boolean);
  for(const c of[...z])z.push(...(c.att||[]),...(c.shadow||[]));if(pending?.cands)z.push(...pending.cands);if(pending?.card)z.push(pending.card);if(pending?.cards)z.push(...pending.cards);return z}

    return `<main class="page"><button class="ghost" id="back">← Baralhos</button><h1>${esc(d.name)}</h1><p class="lede">${deckSize(d)} cartas · ameaça inicial ${d.heroes.reduce((t,id)=>t+def(id).cost,0)}</p>${heroStrip(d.heroes)}
    ${['Ally','Attachment','Event'].filter(t=>groups[t]).map(t=>`<h2>${TP[t]}s <small>${groups[t].reduce((a,[, q])=>a+q,0)}</small></h2><div class="grid">${groups[t].map(([x,q,id])=>`<div class="tile ${IMPLEMENTED.has(x.name)?'':'locked'}" data-def="${id}"><div class="card">${face(x)}${imgTag(x)}</div><em class="bd cnt">×${q}</em></div>`).join('')}</div>`).join('')}</main>`}
  const st=Object.entries(STARTERS).map(([k,d])=>{const ok=k===AUTO_DECK;return `<div class="deck ${ok?'':'off'}" data-deck="${k}">${heroStrip(d.heroes)}<b>${esc(d.name)}</b><small>${deckSize(d)} cartas · ${ok?'Automatizado':'Bloqueado'}</small></div>`}).join('');
  const my=deckList().map((d,i)=>`<div class="deck" data-my="${i}">${heroStrip(d.heroes)}<b>${esc(d.name)}</b><small>${deckSize(d)} cartas · Personalizado</small></div>`).join('');
  return `<main class="page"><h1>Baralhos</h1><p class="lede">Baralhos iniciais oficiais. Por agora só Riders of Rohan tem todas as cartas automatizadas; os outros ficam bloqueados até as suas cartas terem regras.</p><div class="decks">${st}</div>
  <h2>Os teus baralhos</h2>${my?`<div class="decks">${my}</div>`:'<p class="muted">Ainda não tens baralhos. Cria um no Construtor.</p>'}</main>`}
function pool(){const ids=new Set();for(const d of Object.values(STARTERS))for(const id of[...d.heroes,...d.cards.map(x=>x[0])])ids.add(id);return[...ids].map(id=>[id,def(id)])}
function pageBuilder(){
  const b=ui.build||(ui.build={name:'Novo baralho',heroes:[],cards:{}});
  const P=pool(),on=P.filter(([,d])=>IMPLEMENTED.has(d.name)),off=P.filter(([,d])=>!IMPLEMENTED.has(d.name));
  const n=Object.values(b.cards).reduce((a,v)=>a+v,0),thr=b.heroes.reduce((t,id)=>t+def(id).cost,0);
  const tile=([id,d])=>{const q=d.type==='Hero'?(b.heroes.includes(id)?1:0):(b.cards[id]||0);
    return `<div class="tile ${q?'pick':''}" data-def="${id}"><div class="card">${face(d)}${imgTag(d)}</div><div class="qty"><button data-dec="${id}" aria-label="Menos">−</button><b>${q}</b><button data-inc="${id}" aria-label="Mais">+</button></div></div>`};
  const by=t=>on.filter(([,d])=>d.type===t);
  return `<main class="page"><h1>Construtor</h1><p class="lede">Monta um baralho só com cartas automatizadas: até 3 heróis e até 3 cópias de cada carta (1 nas únicas e na The Red Arrow).</p>
  <div class="bbar"><input id="bname" value="${esc(b.name)}" aria-label="Nome do baralho"><span>${b.heroes.length}/3 heróis · ${n} cartas · ameaça ${thr}${n&&n<50?' · baralhos normais têm 50+':''}</span><button class="gold" id="bsave" ${b.heroes.length&&n>=20?'':'disabled'}>Guardar</button><button class="ghost" id="bclear">Limpar</button></div>
  ${['Hero','Ally','Attachment','Event'].map(t=>`<h2>${TP[t]}s</h2><div class="grid">${by(t).map(tile).join('')}</div>`).join('')}
  <details class="how"><summary>${off.length} cartas ainda bloqueadas (sem automação)</summary><div class="grid">${off.map(([id,d])=>`<div class="tile locked" data-def="${id}"><div class="card">${face(d)}${imgTag(d)}</div></div>`).join('')}</div></details></main>`}

// ---------- mesa ----------
function board(){
  if(!G)return `<main class="page"><p class="muted">Não há jogo a decorrer. <a href="#jogar">Escolhe um cenário.</a></p></main>`;
  const P=pending,pk=P&&P.kind==='pick'&&!ui.min?null:null;
  const hl=c=>G.window&&(G.hand.includes(c)?canPlay(c):canUse(c));
  const zone=(cls,label,inner,extra='')=>`<section class="zone ${cls}"><label>${label}</label><div class="row">${inner}</div>${extra}</section>`;
  const thrS=stagingThreat();
  return `<div class="board">
   <div class="brow r1">
     ${zone('z-quest','Missão',cardEl(G.quest)+`<em class="bd prgq">${G.qprog}/${G.quest.d.qp??'–'}</em>`)}
     ${zone('z-pile','Encontro',pile(G.edeck,'encounter','edeck'))}
     ${zone('z-pile','Descarte',pile(G.ediscard,'up','ediscard'))}
     ${zone('z-staging grow','Preparação',G.staging.map(c=>cardEl(c,{thr:1})).join(''),`<em class="bd thrT" title="Ameaça total">${thrS}</em>`)}
   </div>
   <div class="brow r2">
     ${zone('z-heroes grow','Heróis',G.heroes.map(c=>cardEl(c,{stats:1,hl:hl(c)})).join(''))}
     ${zone('z-loc','Localização',G.active?cardEl(G.active):'')}
     ${zone('z-eng grow','Enfrentados',G.engaged.map(c=>cardEl(c,{atk:1,note:c.feint?'Feint':''})).join(''))}
   </div>
   <div class="brow r3">
     ${zone('z-play grow','Área de jogo',G.allies.map(c=>cardEl(c,{stats:1,hl:hl(c)})).join(''))}
     ${zone('z-pile','Baralho',pile(G.deck,'player','deck'))}
     ${zone('z-pile','Descarte',pile(G.discard,'up','discard'))}
     ${G.victory.length?zone('z-pile','Vitória',pile(G.victory,'up','victory')):''}
   </div>
  </div>
  ${ui.hand?`<section class="hand"><label>Mão · ${G.hand.length}</label><div class="row">${G.hand.map(c=>cardEl(c,{hl:hl(c)})).join('')||'<p class="muted">Mão vazia.</p>'}</div></section>`:''}
  ${ui.log?`<aside class="log">${G.log.slice(-80).reverse().map(l=>`<p class="${l.cls}">${esc(l.m)}</p>`).join('')}</aside>`:''}
  <footer class="bar">
    <a class="ib btn ghost" href="#jogar" aria-label="Menu">Menu</a><button class="ib" id="tlog" aria-label="Registo">${ui.log?'✕':'☰'}</button>
    <span class="thr" title="Ameaça">${G.threat}<small>ameaça</small></span>
    <span class="ph">${G.round?G.round+' · ':''}${esc(G.phase)}${G.over?' · fim':''}</span>
    ${P&&P.kind==='window'?`<span class="wt">${esc(P.title)}</span><button class="gold" id="pass">Continuar</button>`:''}
    ${P&&P.kind!=='window'&&ui.min?`<button class="gold" id="unmin">Voltar à escolha</button>`:''}
    <button class="ib hb" id="thand">${ui.hand?'▼':'▲'} Mão ${G.hand.length}</button>
  </footer>
  ${G.error?`<div class="modal"><div class="box"><h3>Erro no motor</h3><pre>${esc(G.error)}</pre><a class="gold btn" href="#jogar">Voltar</a></div></div>`:''}
  ${G.over?`<div class="modal"><div class="box end ${G.over.win?'win':'lose'}"><h3>${G.over.win?'Vitória':'Derrota'}</h3><p>${esc(G.over.msg)}</p><p class="muted">Ronda ${G.round} · ameaça ${G.threat} · ${G.victory.reduce((t,c)=>t+(c.d.vp||0),0)} pontos de vitória</p><div class="btns"><button class="gold" id="again">Jogar outra vez</button><a class="ghost btn" href="#jogar">Menu</a></div></div></div>`:''}
  ${P&&P.kind!=='window'&&!ui.min?promptBox(P):''}
  <div class="rotate"><svg viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="currentColor" stroke-width="3"><rect x="20" y="8" width="24" height="44" rx="5"/><path d="M50 40a20 20 0 0 1-14 16M40 52l-4 4 4 4"/></svg><b>Vira o telemóvel para jogar</b><p>A mesa precisa de ecrã na horizontal. O jogo fica como está.</p></div>`}
function promptBox(P){
  const head=`<div class="ph2"><h3>${esc(P.title)}</h3><button class="ib" id="min" aria-label="Ver mesa">–</button></div>`;
  if(P.kind==='buttons')return `<div class="modal"><div class="box">${head}${P.text?`<p>${esc(icon(P.text))}</p>`:''}
    <div class="pbody">${P.card?`<div class="big">${cardEl(P.card)}</div>`:''}${P.card&&!P.cards?`<div class="ztext">${zText(P.card)}</div>`:''}${P.cards?`<div class="row wrap">${P.cards.map(c=>cardEl(c)).join('')}</div>`:''}</div>
    <div class="btns">${P.options.map((o,i)=>`<button class="${o.primary?'gold':'ghost'}" data-opt="${i}">${esc(o.label)}</button>`).join('')}</div></div></div>`;
  const ok=ui.sel.size>=P.min&&ui.sel.size<=P.max;
  const lab=c=>P.stat==='hpleft'?`${stat(c,'hp')-c.dmg} PV`:P.stat==='qp'?`${c.d.qp} PM · ${stat(c,'thr')} AME`:P.stat==='eng'?`enfrent. ${c.d.eng}`:P.stat?`${{w:'FV',a:'ATQ',d:'DEF'}[P.stat]} ${stat(c,P.stat)}${isChar(c)?` · ${stat(c,'hp')-c.dmg} PV`:''}`:'';
  const sum=P.stat&&['w','a'].includes(P.stat)?[...ui.sel].reduce((t,u)=>t+stat(find(u),P.stat),0):null;
  return `<div class="modal"><div class="box">${head}${P.text?`<p>${esc(P.text)}</p>`:''}
    <div class="pbody">${P.card?`<div class="big sm">${cardEl(P.card)}</div>`:''}<div class="row wrap picks">${P.cands.map(c=>`<div class="pk">${cardEl(c,{sel:ui.sel.has(c.uid)})}<small>${esc(lab(c))}</small></div>`).join('')}</div></div>
    <div class="btns"><span class="muted">${P.max>1?`${ui.sel.size} escolhida(s)`:''}${sum!=null?` · total ${sum}`:''}</span>${P.min===0?`<button class="ghost" id="none">${P.max>1?'Nenhuma':'Nenhum / passar'}</button>`:''}<button class="gold" id="ok" ${ok?'':'disabled'}>Confirmar</button></div></div></div>`}
function zText(c){const d=c.d;return `<b class="zn">${esc(d.name)}</b><i>${esc(TP[d.type]||d.type)}${d.sphere?' · '+esc(d.sphere):''}${d.traits?.length?' · '+esc(d.traits.join('. ')):''}</i>
  ${d.kw?`<p><b>${esc(d.kw)}</b></p>`:''}${d.text?`<p>${esc(icon(d.text))}</p>`:''}${d.shadow?`<p class="sh">${esc(icon(d.shadow))}</p>`:''}
  ${G&&isChar(c)?`<p class="cur">Atual: FV ${stat(c,'w')} · ATQ ${stat(c,'a')} · DEF ${stat(c,'d')} · PV ${stat(c,'hp')-c.dmg}/${stat(c,'hp')}</p>`:''}
  ${G&&(isEnemy(c)&&enemiesInPlay().includes(c))?`<p class="cur">Atual: ATQ ${stat(c,'a')} · DEF ${stat(c,'d')} · PV ${stat(c,'hp')-c.dmg}/${stat(c,'hp')} · AME ${stat(c,'thr')}</p>`:''}
  ${!IMPLEMENTED.has(d.name)&&d.back==='player'?'<p class="muted">Carta ainda sem automação.</p>':''}`}
function zoomBox(){
  const z=ui.zoom;if(!z)return'';const c=z.c||{d:z.d,att:[]};
  const btn=[];
  if(z.c&&G&&pending?.kind==='window'){
    if(G.hand.includes(z.c)){if(canPlay(z.c))btn.push(`<button class="gold" id="zplay">Jogar (custo ${costOf(z.c)})</button>`);else btn.push(`<span class="muted">${RESP[N(z.c)]||'Não pode ser jogada agora.'}</span>`)}
    if(canUse(z.c))btn.push(`<button class="gold" id="zabil">${esc(ABIL[N(z.c)].label)}</button>`)}
  return `<div class="modal" id="zbg"><div class="box zoom"><div class="ph2"><h3>${esc(c.d.name)}</h3><button class="ib" id="zclose" aria-label="Fechar">✕</button></div>
   <div class="pbody"><div class="big">${z.c?cardEl(z.c):`<div class="slot"><div class="card">${face(c.d)}${imgTag(c.d)}</div></div>`}</div><div class="ztext">${zText(c)}${z.c&&z.c.att?.length?`<p>Anexos: ${z.c.att.map(a=>esc(N(a))).join(', ')}</p>`:''}</div></div>
   <div class="btns">${btn.join('')}</div></div></div>`}
function pileBox(){const p=ui.pile;if(!p||!G)return'';const l={discard:G.discard,ediscard:G.ediscard,victory:G.victory}[p.k];
  return `<div class="modal"><div class="box"><div class="ph2"><h3>${esc(p.title)} · ${l.length}</h3><button class="ib" id="pclose" aria-label="Fechar">✕</button></div><div class="row wrap picks">${[...l].reverse().map(c=>cardEl(c)).join('')}</div></div></div>`}
function setupBox(){
  const s=ui.setup;if(!s)return'';
  const seg=(label,opts,val)=>`<div class="fld"><label>${label}</label><div class="seg">${opts.map(([v,t,ok])=>`<button class="${v===val?'on':''}" ${ok?'':'disabled'}>${t}</button>`).join('')}</div></div>`;
  if(s.step===1)return `<div class="modal"><div class="box"><div class="ph2"><h3>${esc(s.scen)}</h3><button class="ib" id="scx" aria-label="Fechar">✕</button></div>
    <div class="fields">${seg('Modo',[['pve','PvE',1],['enc','Encounter',0]],'pve')}${seg('Jogadores',[[1,'1',1],[2,'2',0],[3,'3',0],[4,'4',0]],1)}${seg('Dificuldade',[['e','Easy',0],['n','Normal',1],['x','Nightmare',0]],'n')}${seg('Modo campanha',[['y','Yes',0],['ex','Expert',0],['no','No',1]],'no')}</div>
    <p class="muted">Só as opções automatizadas estão ativas.</p><div class="btns"><button class="ghost" id="scx2">Cancelar</button><button class="gold" id="sc1">Seguinte</button></div></div></div>`;
  const my=deckList();
  return `<div class="modal"><div class="box"><div class="ph2"><h3>Escolhe o teu baralho</h3><button class="ib" id="scx" aria-label="Fechar">✕</button></div>
   <div class="dpick">${Object.entries(STARTERS).map(([k,d])=>`<button class="dp ${s.deck==='s:'+k?'on':''}" data-dp="s:${k}" ${k===AUTO_DECK?'':'disabled'}>${esc(d.name)}<small>${k===AUTO_DECK?'Baralho inicial':'Bloqueado'}</small></button>`).join('')}
   ${my.map((d,i)=>`<button class="dp ${s.deck==='m:'+i?'on':''}" data-dp="m:${i}">${esc(d.name)}<small>Personalizado · ${deckSize(d)} cartas</small></button>`).join('')}</div>
   <div class="btns"><button class="ghost" id="scx2">Cancelar</button><button class="gold" id="sc2" ${s.deck?'':'disabled'}>Começar</button></div></div></div>`}

H.render=function(){
  const r=route(),app=$('#app');
  const body=r==='mesa'?board():r==='baralhos'?pageDecks():r==='construtor'?pageBuilder():pagePlay();
  const y=window.scrollY;
  app.className=r==='mesa'?'is-board':'';
  app.innerHTML=(r==='mesa'?'':nav())+body+pileBox()+zoomBox()+setupBox();
  if(r!=='mesa')window.scrollTo(0,y);
  const q=$('#q');if(q&&ui.focusQ){q.focus();q.setSelectionRange(q.value.length,q.value.length)}
};
let lastDeck=null;
function startWith(deck){lastDeck=deck;ui.setup=null;ui.hand=false;ui.log=false;newGame(deck);location.hash='mesa';H.render();runGame()}

document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;ui.focusQ=true;H.render();ui.focusQ=false}if(e.target.id==='bname')ui.build.name=e.target.value});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-uid],[data-def],[data-deck],[data-my],.pile,#zbg');if(!t)return;
  const id=t.id,P=pending;
  if(t.dataset.ed){ui.open[t.dataset.ed]=!ui.open[t.dataset.ed];return H.render()}
  if(t.dataset.scen){ui.setup={step:1,scen:t.dataset.scen,deck:'s:'+AUTO_DECK};return H.render()}
  if(id==='scx'||id==='scx2'){ui.setup=null;return H.render()}
  if(id==='sc1'){ui.setup.step=2;return H.render()}
  if(t.dataset.dp){ui.setup.deck=t.dataset.dp;return H.render()}
  if(id==='sc2'){const[k,v]=ui.setup.deck.split(':');const d=k==='s'?{name:STARTERS[v].name,heroes:STARTERS[v].heroes,cards:STARTERS[v].cards}:deckList()[+v];return startWith(d)}
  if(t.dataset.deck){if(t.classList.contains('off')&&!e.target.closest('.deck'))return;ui.deckView=STARTERS[t.dataset.deck];window.scrollTo(0,0);return H.render()}
  if(t.dataset.my){ui.deckView=deckList()[+t.dataset.my];window.scrollTo(0,0);return H.render()}
  if(id==='back'){ui.deckView=null;return H.render()}
  if(t.dataset.inc||t.dataset.dec){const did=t.dataset.inc||t.dataset.dec,d=def(did),b=ui.build,inc=!!t.dataset.inc;
    if(d.type==='Hero'){if(inc&&!b.heroes.includes(did)&&b.heroes.length<3)b.heroes.push(did);if(!inc)b.heroes=b.heroes.filter(x=>x!==did)}
    else{const lim=d.unique||d.name==='The Red Arrow'?(d.name==='The Red Arrow'?1:3):3;b.cards[did]=Math.max(0,Math.min(lim,(b.cards[did]||0)+(inc?1:-1)));if(!b.cards[did])delete b.cards[did]}
    return H.render()}
  if(id==='bsave'){const b=ui.build,l=deckList();l.push({name:b.name||'Baralho',heroes:b.heroes,cards:Object.entries(b.cards)});saveDecks(l);ui.build=null;location.hash='baralhos';ui.deckView=null;return H.render()}
  if(id==='bclear'){ui.build=null;return H.render()}
  if(t.dataset.def&&!e.target.closest('.qty')){ui.zoom={d:def(t.dataset.def)};return H.render()}
  if(id==='zclose'||(id==='zbg'&&e.target===t)){ui.zoom=null;return H.render()}
  if(id==='zplay'){const c=ui.zoom.c;return resolve({type:'play',c})}
  if(id==='zabil'){const c=ui.zoom.c;return resolve({type:'abil',c})}
  if(id==='pass')return resolve('pass');
  if(id==='tlog'){ui.log=!ui.log;return H.render()}
  if(id==='thand'){ui.hand=!ui.hand;return H.render()}
  if(id==='min'){ui.min=true;return H.render()}
  if(id==='unmin'){ui.min=false;return H.render()}
  if(id==='again'){return startWith(lastDeck)}
  if(t.dataset.opt!=null&&P)return resolve(P.options[+t.dataset.opt].value);
  if(id==='none'&&P)return resolve([]);
  if(id==='ok'&&P)return resolve(P.cands.filter(c=>ui.sel.has(c.uid)));
  if(t.dataset.uid){const c=find(t.dataset.uid);if(!c)return;
    if(t.closest('.pile')&&!t.closest('.modal')){const k=t.closest('.pile').dataset.pile;if(k!=='edeck'&&k!=='deck'){ui.pile={k,title:{discard:'O teu descarte',ediscard:'Descarte de encontro',victory:'Vitória'}[k]};return H.render()}}
    if(P&&P.kind==='pick'&&!ui.min&&P.cands.includes(c)){
      if(ui.sel.has(c.uid))ui.sel.delete(c.uid);else{if(P.max===1)ui.sel.clear();if(ui.sel.size<P.max)ui.sel.add(c.uid)}return H.render()}
    if(t.closest('.zoom'))return;
    ui.zoom={c};return H.render()}
  if(id==='pclose'){ui.pile=null;return H.render()}
  if(t.classList.contains('pile')&&G){const k=t.dataset.pile,l={discard:G.discard,ediscard:G.ediscard,victory:G.victory}[k];if(l&&l.length){ui.pile={k,title:{discard:'O teu descarte',ediscard:'Descarte de encontro',victory:'Vitória'}[k]};return H.render()}}
});
window.addEventListener('hashchange',()=>{if(location.hash!=='#baralhos')ui.deckView=null;ui.zoom=null;H.render()});
H.render();
}

</script>
</body>
